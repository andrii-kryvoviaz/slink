name: 'Load Test Docker Image'
description: 'Loads the test Docker image from the CI build cache'

runs:
  using: 'composite'
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Load Test Docker image
      uses: docker/bake-action@v7
      with:
        source: .
        targets: test
        load: true
        set: |
          test.tags=slink-test:${{ github.sha }}
          *.cache-from=type=gha,scope=test-build
