name: 'Storage Test'
description: 'Run storage integration tests on the test Docker image'

runs:
  using: 'composite'
  steps:
    - uses: ./.github/actions/build-test-image

    - shell: bash
      run: docker compose -f docker/docker-compose.storage-test.yaml -p slink-storage-test up -d --wait

    - shell: bash
      run: |
        docker run --rm --network slink-storage-test_default \
          -e CI=true \
          -e STORAGE_TEST_SMB_HOST=samba \
          -e STORAGE_TEST_S3_ENDPOINT=http://seaweedfs:8333 \
          slink-test:${{ github.sha }} \
          php /services/api/vendor/bin/phpunit --configuration /services/api/phpunit.xml --group storage-integration --no-coverage

    - name: Dump backend logs
      if: failure()
      shell: bash
      run: |
        docker compose -f docker/docker-compose.storage-test.yaml -p slink-storage-test logs
        docker ps -a
