name: 'Lint'
description: 'Run ESLint on the client'

runs:
  using: 'composite'
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 12

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: "24"
        cache: "pnpm"
        cache-dependency-path: "./services/client/pnpm-lock.yaml"

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --dir ./services/client

    - name: Run ESLint
      shell: bash
      run: pnpm --dir ./services/client run lint
