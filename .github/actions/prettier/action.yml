name: 'Prettier'
description: 'Run Prettier on the codebase'

runs:
  using: 'composite'
  steps:
    - uses: pnpm/action-setup@v6
      with:
        version: 12

    - uses: actions/setup-node@v5
      with:
        node-version: '24'
        cache: 'pnpm'
        cache-dependency-path: './services/client/pnpm-lock.yaml'

    - run: pnpm install --frozen-lockfile --dir ./services/client
      shell: bash

    - run: pnpm --dir ./services/client run lint
      shell: bash
      continue-on-error: true

    - run: pnpm --dir ./services/client run format
      shell: bash

    - uses: ./.github/actions/commit-bot
      with:
        commit-message: 'chore(prettier): Format codebase'
        push: true
