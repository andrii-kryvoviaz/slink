name: CI

on:
  workflow_call:

  push:
    branches: ["**"]
    paths:
      - "services/**"
      - "docker/**"
      - "docker-bake.hcl"
      - ".github/**"

  pull_request:
    branches: [main, develop]
    paths:
      - "services/**"
      - "docker/**"
      - "docker-bake.hcl"
      - ".github/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend || 'true' }}
      frontend: ${{ steps.filter.outputs.frontend || 'true' }}
    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/')
        with:
          base: ${{ github.ref_name }}
          filters: |
            backend:
              - 'services/api/**'
              - 'docker/**'
              - 'docker-bake.hcl'
              - '.github/**'
            frontend:
              - 'services/client/**'
              - '.github/**'

      - name: Set up Docker Buildx
        if: steps.filter.outputs.backend != 'false' || steps.filter.outputs.frontend != 'false'
        uses: docker/setup-buildx-action@v4

      - name: Build test and E2E images
        if: steps.filter.outputs.backend != 'false' || steps.filter.outputs.frontend != 'false'
        uses: docker/bake-action@v7
        with:
          source: .
          targets: |
            test
            e2e
          load: false
          set: |
            test.tags=slink-test:${{ github.sha }}
            *.cache-from=type=gha,scope=test-build
            *.cache-from=type=gha,scope=e2e
            test.cache-to=type=gha,scope=test-build,mode=max
            e2e.cache-to=type=gha,scope=e2e,mode=max

  backend:
    name: Backend
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.backend == 'true'
    strategy:
      fail-fast: false
      matrix:
        task: [lint, test, storage]
    steps:
      - uses: actions/checkout@v5

      - name: PHPStan Static Analysis
        if: matrix.task == 'lint'
        uses: ./.github/actions/phpstan

      - name: PHPUnit tests
        if: matrix.task == 'test'
        uses: ./.github/actions/phpunit

      - name: Storage integration tests
        if: matrix.task == 'storage'
        uses: ./.github/actions/storage-test

  client-lint:
    name: Client (lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: ESLint
        uses: ./.github/actions/eslint

  client-e2e:
    name: Client (e2e)
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.frontend == 'true' || needs.build.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v5

      - name: E2E Tests
        uses: ./.github/actions/e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: services/client/playwright-report/

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: services/client/test-results/
