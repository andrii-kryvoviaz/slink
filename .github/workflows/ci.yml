name: CI

on:
  workflow_call:

  push:
    branches: ["**"]
    paths:
      - "services/**"
      - "docker/**"
      - "docker-bake.hcl"
      - ".github/**"

  pull_request:
    branches: [main, develop]
    paths:
      - "services/**"
      - "docker/**"
      - "docker-bake.hcl"
      - ".github/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend || 'true' }}
      frontend: ${{ steps.filter.outputs.frontend || 'true' }}
    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/')
        with:
          base: ${{ github.ref_name }}
          filters: |
            backend:
              - 'services/api/**'
              - 'docker/**'
              - 'docker-bake.hcl'
              - '.github/**'
            frontend:
              - 'services/client/**'
              - '.github/**'

  backend:
    name: Backend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    strategy:
      fail-fast: false
      matrix:
        task: [lint, test, storage]
    steps:
      - uses: actions/checkout@v5

      - name: PHPStan Static Analysis
        if: matrix.task == 'lint'
        uses: ./.github/actions/phpstan

      - name: PHPUnit tests
        if: matrix.task == 'test'
        uses: ./.github/actions/phpunit

      - name: Storage integration tests
        if: matrix.task == 'storage'
        uses: ./.github/actions/storage-test

  client:
    name: Client
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true'
    strategy:
      fail-fast: false
      matrix:
        task: [lint, e2e]
    steps:
      - uses: actions/checkout@v5

      - name: ESLint
        if: matrix.task == 'lint' && needs.changes.outputs.frontend == 'true'
        uses: ./.github/actions/eslint

      - name: E2E Tests
        if: matrix.task == 'e2e'
        uses: ./.github/actions/e2e

      - name: Upload Playwright report
        if: always() && matrix.task == 'e2e'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: services/client/playwright-report/

      - name: Upload test results
        if: failure() && matrix.task == 'e2e'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: services/client/test-results/
