run-name: Release ${{ github.ref_name }}
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  actions: read
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.current }}
      prerelease: ${{ steps.semver.outputs.prerelease }}
      tested: ${{ steps.tested.outputs.tested }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get versions
        id: version
        run: |
          latest=$(git -c versionsort.suffix=- tag -l 'v*' --sort=-v:refname | grep -vx "$GITHUB_REF_NAME" | head -1)
          echo "latest=${latest#v}" >> "$GITHUB_OUTPUT"
          echo "current=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: madhead/semver-utils@v5
        id: semver
        with:
          version: ${{ steps.version.outputs.current }}
          compare-to: ${{ steps.version.outputs.latest }}

      - name: Validate version
        env:
          SEMVER_RELEASE: ${{ steps.semver.outputs.release }}
        run: |
          if [[ -z "$SEMVER_RELEASE" ]]; then
            echo "Invalid version format. Please use a valid semver version."
            exit 1
          fi

      - name: Check version is greater
        env:
          COMPARISON: ${{ steps.semver.outputs.comparison-result }}
          CURRENT: ${{ steps.version.outputs.current }}
          LATEST: ${{ steps.version.outputs.latest }}
        run: |
          if [[ "$COMPARISON" != ">" ]]; then
            printf "Version %s is not greater than the last version %s" "$CURRENT" "$LATEST"
            exit 1
          fi

      - name: Check commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tagged commit $GITHUB_SHA is not on main."
            exit 1
          fi

      - name: Check commit is already tested
        id: tested
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.version.outputs.latest }}
        run: |
          limit=500
          tested=false
          if [[ -n "$LATEST" ]] \
            && since=$(TZ=UTC git log -1 --date=format-local:%Y-%m-%dT%H:%M:%SZ --format=%cd "v$LATEST") \
            && range=$(git rev-list "v$LATEST..$GITHUB_SHA") \
            && runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push --created ">=$since" --limit "$limit" --json headSha,conclusion,status) \
            && jq -e --arg tip "$GITHUB_SHA" --arg range "$range" --argjson limit "$limit" '
              ($range | split("\n")) as $shas
              | [.[] | select(.headSha | IN($shas[]))] as $runs
              | length < $limit
              and any($runs[]; .headSha == $tip)
              and all($runs[]; .status == "completed" and .conclusion == "success")
            ' <<< "$runs" > /dev/null; then
            tested=true
          fi
          echo "Commit already tested on main: $tested"
          echo "tested=$tested" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: validate
    if: needs.validate.outputs.tested != 'true'
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build:
    name: Build
    needs: [validate, ci]
    if: ${{ !cancelled() && needs.validate.result == 'success' && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    uses: ./.github/workflows/docker-build.yml
    with:
      tag: ${{ github.ref_name }}
      version: ${{ needs.validate.outputs.version }}
      ref: ${{ github.sha }}
      latest: ${{ needs.validate.outputs.prerelease == '' }}
    secrets: inherit

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [validate, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    steps:
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          flags=()
          if [[ -n "$PRERELEASE" ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" \
            --repo="$GITHUB_REPOSITORY" \
            --title="$TAG" \
            --generate-notes \
            --draft \
            "${flags[@]}"
