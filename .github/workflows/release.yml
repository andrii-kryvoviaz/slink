run-name: Release ${{ github.ref_name }}
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.current }}
      prerelease: ${{ steps.semver.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get versions
        id: version
        run: |
          latest=$(git -c versionsort.suffix=- tag -l 'v*' --sort=-v:refname | grep -vx "$GITHUB_REF_NAME" | head -1)
          echo "latest=${latest#v}" >> "$GITHUB_OUTPUT"
          echo "current=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: madhead/semver-utils@v5
        id: semver
        with:
          version: ${{ steps.version.outputs.current }}
          compare-to: ${{ steps.version.outputs.latest }}

      - name: Validate version
        env:
          SEMVER_RELEASE: ${{ steps.semver.outputs.release }}
        run: |
          if [[ -z "$SEMVER_RELEASE" ]]; then
            echo "Invalid version format. Please use a valid semver version."
            exit 1
          fi

      - name: Check version is greater
        env:
          COMPARISON: ${{ steps.semver.outputs.comparison-result }}
          CURRENT: ${{ steps.version.outputs.current }}
          LATEST: ${{ steps.version.outputs.latest }}
        run: |
          if [[ "$COMPARISON" != ">" ]]; then
            printf "Version %s is not greater than the last version %s" "$CURRENT" "$LATEST"
            exit 1
          fi

      - name: Check commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tagged commit $GITHUB_SHA is not on main."
            exit 1
          fi

  ci:
    name: CI
    needs: validate
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build:
    name: Build
    needs: [validate, ci]
    uses: ./.github/workflows/docker-build.yml
    with:
      tag: ${{ github.ref_name }}
      version: ${{ needs.validate.outputs.version }}
      ref: ${{ github.sha }}
      latest: ${{ needs.validate.outputs.prerelease == '' }}
    secrets: inherit

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [validate, build]
    steps:
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          flags=()
          if [[ -n "$PRERELEASE" ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" \
            --repo="$GITHUB_REPOSITORY" \
            --title="$TAG" \
            --generate-notes \
            "${flags[@]}"
