services:
  slink:
    image: slink:e2e
    container_name: slink-e2e
    ports:
      - "3100:3000"
      - "8180:8080"
    environment:
      - APP_ENV=test
      - APP_DEBUG=0
      - ORIGIN=http://localhost:3100
      - SESSION_TTL_SECONDS=1209600
      - SLINK_VERSION=${E2E_SLINK_VERSION:-dev}
