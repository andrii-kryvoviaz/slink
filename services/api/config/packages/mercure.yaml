mercure:
  hubs:
    default:
      url: '%env(MERCURE_HUB_URL)%'
      public_url: '%env(MERCURE_PUBLIC_URL)%'
      jwt:
        secret: '%env(MERCURE_JWT_SECRET)%'
        publish: ['*']
        claims:
          iss: slink
          sub: slink
          client_id: slink
          aud: https://mercure.slink.example
      cookie_name: mercure_access_token
  default_cookie_lifetime: 1800
