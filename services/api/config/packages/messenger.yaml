framework:
    messenger:
        default_bus: messenger.bus.command
        failure_transport: failed
        buses:
            messenger.bus.command:
                default_middleware: false
                middleware:
                    - handle_message
                    - doctrine_transaction

            messenger.bus.query:
                default_middleware: false
                middleware:
                    - handle_message

            messenger.bus.event:
                default_middleware: allow_no_handlers

            messenger.bus.feed:
                middleware:
                    - doctrine_ping_connection: ['read_model']
                    - doctrine_close_connection: ['read_model']

        transports:
             failed: 'doctrine://event_store?queue_name=failed'
             sync: 'sync://'
             feed:
                 dsn: 'doctrine://read_model'
                 options:
                     table_name: message_queue
                     queue_name: feed
                     auto_setup: false
                     redeliver_timeout: 60
                 failure_transport: feed_failed
                 retry_strategy:
                     max_retries: 5
                     delay: 1000
                     multiplier: 2
                     max_delay: 30000
             feed_failed:
                 dsn: 'doctrine://read_model'
                 options:
                     table_name: message_queue
                     queue_name: feed_failed
                     auto_setup: false

        routing:
            Slink\Image\Infrastructure\Message\ImageFeedChanged: feed

when@test:
    framework:
        messenger:
            transports:
                # replace with your transport name here (e.g., my_transport: 'in-memory://')
                # For more Messenger testing tools, see https://github.com/zenstruck/messenger-test
                async: 'in-memory://'
